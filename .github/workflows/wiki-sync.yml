name: Sync Wiki

on:
  push:
    branches:
      - main
      - master
    paths:
      - "wiki/**"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Sync local wiki directory to GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          wiki_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git ls-remote "$wiki_url" >/dev/null 2>&1; then
            echo "::notice title=GitHub Wiki unavailable::${GITHUB_REPOSITORY}.wiki.git is not reachable. Enable the repository Wiki and create its first page, then rerun this workflow."
            exit 0
          fi

          git clone "$wiki_url" "$tmp_dir/wiki"

          rsync -a --delete --exclude ".git/" wiki/ "$tmp_dir/wiki/"

          cd "$tmp_dir/wiki"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No wiki changes to sync."
            exit 0
          fi

          git commit -m "docs(wiki): sync from ${GITHUB_SHA}"
          git push origin HEAD:master
